name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
      - run: uv run --with 'jsonschema>=4.23' python tools/check_contract.py
      - run: uv run --with 'pyyaml>=6' python tools/check_suite.py
      - run: uv run --with 'pyyaml>=6' --with pytest python -m pytest -q tools/test_check_suite.py
